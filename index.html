<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>День ежа — Путешествие домой: was / were</title>
<style>
:root{
  --cream:#fff2ca; --cream2:#f4d98d; --wood:#6c3516; --wood2:#3d1d0d;
  --green:#466d1f; --green2:#7ea92b; --gold:#ffc84d; --purple:#673a87;
  --blue:#2379a8; --red:#bf423a; --shadow:0 10px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1510;font-family:Georgia,"Times New Roman",serif;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#stage{
  position:relative;
  width:min(100vw,calc(100vh * 1.7768331562));
  aspect-ratio:1672/941;
  max-height:100vh;
  overflow:hidden;
  background:#122118;
  box-shadow:0 0 50px #000;
}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
.tint{position:absolute;inset:0;background:rgba(8,25,17,.12);pointer-events:none}
.blur-bg{filter:blur(2px) brightness(.72) saturate(.9);transform:scale(1.015)}
.glass{background:rgba(255,247,215,.93);border:clamp(2px,.25vw,5px) solid rgba(93,47,19,.95);box-shadow:var(--shadow), inset 0 0 0 3px rgba(255,221,120,.38);border-radius:1.6vw}
.wood-panel{
  background:linear-gradient(#8f5425,#633617 45%,#4b260f);
  border:.28vw solid #2f1609;border-radius:1.6vw;box-shadow:var(--shadow), inset 0 0 0 .22vw #c78939;
}
.parchment{
  background:linear-gradient(180deg,rgba(255,244,204,.98),rgba(239,207,139,.98));
  color:#3c210f;border:.2vw solid #8c5527;border-radius:1vw;
  box-shadow:0 .45vw 1vw rgba(0,0,0,.28), inset 0 0 1.2vw rgba(132,80,31,.22);
}
.game-btn{
  border:.19vw solid #3a1d0d;
  background:linear-gradient(#8fbd35,#4c7e19);
  color:#fff6d5;font-weight:900;text-shadow:0 .12vw .12vw #2b1709;
  border-radius:1.1vw;padding:.65vw 1.45vw;font-size:clamp(15px,1.55vw,30px);
  box-shadow:0 .38vw 0 #3c1d0e,0 .55vw 1vw rgba(0,0,0,.35),inset 0 .12vw .18vw rgba(255,255,255,.4);
  cursor:pointer;transition:.12s transform,.12s filter,.12s box-shadow;
}
.game-btn:hover{filter:brightness(1.12);transform:translateY(-.08vw)}
.game-btn:active{transform:translateY(.22vw);box-shadow:0 .12vw 0 #3c1d0e,0 .3vw .5vw rgba(0,0,0,.28)}
.game-btn.gold{background:linear-gradient(#ffd767,#e99a19);color:#4b260d}
.game-btn.purple{background:linear-gradient(#9c65bd,#60317f)}
.game-btn.blue{background:linear-gradient(#52a8d5,#176b98)}
.game-btn.red{background:linear-gradient(#d86a5d,#9c312b)}
.game-btn.small{font-size:clamp(12px,1.12vw,22px);padding:.45vw .85vw;border-radius:.8vw}
.game-btn.disabled{filter:grayscale(.75) brightness(.7);opacity:.75;pointer-events:none}
.choice-hit{
  position:absolute;border-radius:.75vw;border:.22vw solid transparent;cursor:pointer;
  background:rgba(255,255,255,.001);transition:.15s;
}
.choice-hit:hover{border-color:rgba(255,224,93,.8);box-shadow:0 0 1vw rgba(255,210,58,.8)}
.choice-hit.selected{border-color:#ffe45c;box-shadow:0 0 1.35vw #ffd33a;background:rgba(255,210,50,.12)}
.choice-hit.correct{border-color:#72f26b;box-shadow:0 0 1.4vw #57e26a;background:rgba(55,210,75,.13)}
.choice-hit.wrong{border-color:#ff6258;box-shadow:0 0 1.35vw #ff5347;background:rgba(220,45,40,.13);animation:shake .28s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.35vw)}75%{transform:translateX(.35vw)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 .5vw #ffe863}50%{box-shadow:0 0 2vw #fff099}}
.hint-glow{animation:pulseGlow .7s 4;border-color:#fff57f!important}
.spark{position:absolute;width:.35vw;height:.35vw;border-radius:50%;background:#ffe76a;box-shadow:0 0 1vw #ffd84c;animation:floatSpark 2.8s linear forwards}
@keyframes floatSpark{0%{opacity:0;transform:translateY(1vw) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translateY(-7vw) translateX(var(--dx)) scale(1.1)}}
#toast{
  position:absolute;left:50%;top:13%;transform:translate(-50%,-1vw);
  min-width:24%;max-width:70%;padding:.65vw 1.2vw;border-radius:1vw;
  background:rgba(44,24,10,.92);color:#fff6d4;font-size:clamp(15px,1.35vw,25px);
  font-weight:bold;text-align:center;opacity:0;pointer-events:none;z-index:90;
  transition:.22s;box-shadow:var(--shadow);border:.13vw solid #d6a343
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#scoreBadge{
  position:absolute;left:1.3%;top:1.5%;z-index:40;width:14.2%;height:9.8%;
  display:flex;align-items:center;justify-content:center;gap:.6vw;
  background:linear-gradient(#fff1c5,#e7c16c);border:.25vw solid #754219;border-radius:1.2vw;
  box-shadow:0 .3vw .7vw rgba(0,0,0,.3),inset 0 0 0 .15vw rgba(255,255,255,.45);
  color:#49250d;font-weight:900;font-size:clamp(20px,2vw,40px)
}
#scoreBadge .leaf{font-size:1.9em;filter:drop-shadow(0 .1vw .05vw rgba(0,0,0,.3))}
#hudProgress{
 position:absolute;z-index:41;left:29.5%;top:2.1%;width:42%;height:8.2%;
 display:flex;align-items:center;justify-content:space-between;pointer-events:none
}
.node{
 width:3.3vw;height:3.3vw;min-width:28px;min-height:28px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-weight:900;
 font-size:clamp(12px,1.25vw,24px);color:#fff4cf;text-shadow:0 .1vw .12vw #2b1307;
 border:.18vw solid #4c230e;background:radial-gradient(circle at 40% 30%,#b8752f,#704018 70%);
 box-shadow:0 .15vw .25vw rgba(0,0,0,.35)
}
.node.done{background:radial-gradient(circle at 40% 30%,#8fc748,#47731d 72%);box-shadow:0 0 1vw #98ea5b}
.node.current{background:radial-gradient(circle at 40% 30%,#ffe363,#d58b17 72%);box-shadow:0 0 1.6vw #ffd94c;transform:scale(1.12)}
.toolbar-hot{position:absolute;z-index:45;top:1%;height:11%;cursor:pointer;border-radius:50%}
#homeHot{right:12.1%;width:6.7%}
#soundHot{right:5.7%;width:6.2%}
#fullHot{right:.2%;width:5.6%}
#hintBtn{
 position:absolute;z-index:48;left:2.2%;bottom:3%;width:12.8%;
}
#actionBar{
 position:absolute;z-index:47;bottom:3.1%;left:50%;transform:translateX(-50%);
 display:flex;gap:1.4vw;align-items:center;justify-content:center
}
#actionBar .img-button{width:16vw;min-width:138px}
#hintBtn.img-button{width:14.5vw;padding:0;border:0;background:none;box-shadow:none}
#volumePanel{
 position:absolute;z-index:120;right:3%;top:12%;width:28%;padding:1.3vw;
 background:linear-gradient(#fff0c7,#e8c57c);border:.26vw solid #6b3d18;border-radius:1.4vw;
 box-shadow:0 .8vw 2vw rgba(0,0,0,.5),inset 0 0 0 .18vw rgba(255,255,255,.5);

#volumePanel h3{font-size:clamp(18px,1.7vw,34px);margin:.1vw 0 1vw;text-align:center;color:#456d20}
.volRow{display:grid;grid-template-columns:34% 1fr 14%;align-items:center;gap:.55vw;margin:.75vw 0;font-weight:bold;font-size:clamp(13px,1.05vw,21px)}
input[type=range]{width:100%;accent-color:#638d22;cursor:pointer}
.musicSelect{width:100%;padding:.48vw .6vw;border:.14vw solid #7b491f;border-radius:.65vw;background:#fff4cf;color:#3c220f;font:700 clamp(12px,1vw,19px) Georgia,serif;cursor:pointer}
#volumePanel .closex{position:absolute;right:.55vw;top:.35vw;background:none;border:0;font-size:1.8vw;cursor:pointer;color:#5a3014}
#homePanel{
 position:absolute;left:26%;top:18%;width:53%;padding:2.2vw 3vw;text-align:center;z-index:20
}
#homePanel h1{font-size:clamp(44px,5.6vw,106px);line-height:.9;margin:.2vw 0 .7vw;color:#315d22;text-shadow:0 .12vw #fff1ba,0 .28vw .2vw rgba(0,0,0,.28)}
#homePanel h2{font-size:clamp(20px,2vw,38px);margin:.2vw 0 2vw;color:#6c377e}
#homeButtons{display:flex;flex-direction:column;gap:1.1vw;width:58%;margin:auto}
.home-art-hotspot{position:absolute;z-index:50;border:0;background:transparent;padding:0;cursor:pointer;border-radius:1.5vw;transition:.14s filter,.14s transform}
.home-art-hotspot:hover{filter:drop-shadow(0 0 1vw #ffe36a) brightness(1.08);transform:scale(1.015)}
.home-art-hotspot:focus-visible{outline:.28vw solid #fff28a;outline-offset:.18vw}
#homeStartHot{left:33.2%;top:62.7%;width:30%;height:17%}
#homeLegendHot{left:33.5%;top:85.2%;width:16%;height:9.5%}
#homeSettingsHot{left:51.1%;top:85.2%;width:16%;height:9.5%}
#legendContinue{position:absolute;z-index:50;left:31.5%;bottom:2.2%;width:37%;height:11%;cursor:pointer;border-radius:1.2vw}
#mapContinue{position:absolute;z-index:50;left:38%;bottom:2.2%;width:28%;height:10.5%;cursor:pointer;border-radius:1.2vw}
#mapMarker{
  position:absolute;z-index:51;width:7.2vw;height:7.2vw;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 .45vw .35vw rgba(41,20,7,.55)) drop-shadow(0 0 .8vw #ffe177);
  transition:left 1.15s ease-in-out,top 1.15s ease-in-out;
  transform:translate(-50%,-50%);pointer-events:none
}
#mapMarker img{width:100%;height:100%;object-fit:contain;display:block}
#mapMessage{
 position:absolute;z-index:52;left:50%;top:12%;transform:translateX(-50%);
 padding:.55vw 1.25vw;border-radius:1vw;background:rgba(61,34,14,.9);
 border:.14vw solid #e0ad4c;color:#fff4ca;font-size:clamp(13px,1.25vw,24px);font-weight:bold;
 box-shadow:var(--shadow);white-space:nowrap
}
.overlay-card{
 position:absolute;z-index:30;background:linear-gradient(#fff4cd,#e9c87d);
 border:.18vw solid #78451d;border-radius:1vw;box-shadow:0 .4vw 1vw rgba(0,0,0,.36),inset 0 0 .7vw rgba(255,255,255,.5);
 padding:.55vw;text-align:center;color:#40220f
}
.overlay-card .opts{display:flex;gap:.55vw;justify-content:center;margin-top:.35vw}
.mini-choice{
 min-width:39%;padding:.45vw .5vw;border-radius:.7vw;border:.14vw solid #6c3a16;
 background-color:transparent;background-position:center;background-repeat:no-repeat;background-size:100% 100%;color:transparent;font-weight:900;
 font-size:clamp(12px,1.1vw,21px);cursor:pointer;box-shadow:0 .18vw .3vw rgba(0,0,0,.25)
}
.mini-choice[data-v="was"]{background-image:url('assets/images/button-was.webp')}
.mini-choice[data-v="were"]{background-image:url('assets/images/button-were.webp')}
.mini-choice.sel{outline:.22vw solid #ffe04a;box-shadow:0 0 1vw #ffd84f}
.mini-choice.ok{outline:.22vw solid #70ee65;box-shadow:0 0 1vw #58dc58}
.mini-choice.no{outline:.22vw solid #ff6258;box-shadow:0 0 1vw #ff5148}
.reveal{font-size:clamp(12px,1.04vw,20px);font-weight:bold;color:#5d2b79;line-height:1.2;margin-top:.25vw}
#level7Panel{
 position:absolute;z-index:35;left:15%;top:14%;width:70%;height:69%;padding:1.25vw 1.5vw;
 background:linear-gradient(180deg,rgba(255,244,205,.97),rgba(230,194,121,.97));
 border:.28vw solid #693916;border-radius:1.5vw;box-shadow:0 1vw 2.4vw rgba(0,0,0,.55),inset 0 0 0 .2vw #bd8333;
}
#level7Panel h2{text-align:center;color:#315d22;margin:.1vw 0 .4vw;font-size:clamp(26px,2.6vw,50px)}
#level7Panel .sub{text-align:center;color:#673a87;font-size:clamp(14px,1.25vw,24px);font-weight:bold;margin-bottom:.8vw}
#l7Progress{text-align:center;font-weight:bold;color:#6d3a17;font-size:clamp(13px,1vw,19px);margin-bottom:.45vw}
#l7Sentence{font-size:clamp(20px,2vw,38px);font-weight:900;text-align:center;padding:.75vw;border-radius:.8vw;background:rgba(255,255,255,.48);border:.12vw dashed #9d6d30}
#l7StepTitle{text-align:center;margin:.7vw 0 .45vw;font-size:clamp(15px,1.3vw,25px);font-weight:bold;color:#4a6d1e}
#l7Options{display:flex;flex-direction:column;gap:.55vw;width:92%;margin:auto}
.l7opt{
 padding:.65vw 1vw;border:.15vw solid #805022;border-radius:.8vw;background:linear-gradient(#fff5d6,#e7c37c);
 cursor:pointer;font-size:clamp(14px,1.15vw,22px);font-weight:bold;text-align:center;color:#3f220f;box-shadow:0 .2vw .35vw rgba(0,0,0,.22)
}
.l7opt:hover{filter:brightness(1.08)}
.l7opt.ok{outline:.25vw solid #68e85d;box-shadow:0 0 1vw #65dd62}
.l7opt.no{outline:.25vw solid #ff6258;box-shadow:0 0 1vw #ff5347}
#l7Next{display:block;margin:.75vw auto 0}
#completeBurst{
 position:absolute;z-index:85;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
 width:42%;padding:1.2vw;text-align:center;opacity:0;pointer-events:none;
 background:linear-gradient(#fff0b5,#e9bd54);border:.28vw solid #6c3515;border-radius:1.5vw;
 box-shadow:0 0 3vw #ffd86b,0 1vw 2vw rgba(0,0,0,.5);transition:.28s
}
#completeBurst.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#completeBurst .big{font-size:clamp(28px,3vw,58px);font-weight:900;color:#3e6c22}
#completeBurst .small{font-size:clamp(16px,1.45vw,28px);font-weight:bold;color:#5e3519;margin-top:.35vw}
#finalHotReplay{position:absolute;z-index:50;left:31%;bottom:4%;width:25%;height:11%;cursor:pointer;border-radius:1.3vw}
#finalHotHome{position:absolute;z-index:50;left:58%;bottom:4%;width:26%;height:11%;cursor:pointer;border-radius:1.3vw}
#finalScore{
 position:absolute;z-index:55;right:7.5%;top:48%;padding:.45vw .8vw;border-radius:.8vw;
 background:rgba(255,243,205,.9);border:.15vw solid #8a5224;color:#4a2711;font-size:clamp(14px,1.15vw,22px);font-weight:bold;
}
@media(max-width:750px){
 #volumePanel{width:42%}
 #homePanel{left:20%;width:62%}
}

/* === V2 corrections === */
#hudProgress{display:none!important} /* only the illustrated 1–7 bar remains */

.map-stage-hotspot{
  position:absolute;z-index:58;border:0;background:transparent;padding:0;
  border-radius:1.1vw;cursor:pointer;
}
.map-stage-hotspot.unlocked:hover{
  background:transparent;
}
.map-stage-hotspot.locked{cursor:default}
#mapContinue{display:none!important}

#level1SinglePanel{
  position:absolute;z-index:34;left:29.5%;top:38.6%;width:46%;height:36.8%;
  background:linear-gradient(180deg,rgba(255,244,204,.995),rgba(237,205,135,.995));
  border:.28vw solid #734018;border-radius:1.5vw;
  box-shadow:0 .8vw 1.8vw rgba(0,0,0,.42), inset 0 0 0 .18vw rgba(255,255,255,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.25vw 2vw;text-align:center;color:#3e220f;
}
#level1Counter{
  position:absolute;top:.65vw;left:50%;transform:translateX(-50%);
  font-weight:900;color:#704117;font-size:clamp(13px,1.05vw,20px);
}
#level1Title{
  color:#315d22;font-size:clamp(18px,1.55vw,30px);font-weight:900;
  margin:.2vw 0 .4vw;
}
#level1Sentence{
  width:92%;font-size:clamp(25px,2.35vw,46px);line-height:1.15;font-weight:900;
  margin:.6vw 0 1.2vw;text-shadow:0 .05vw #fff7d6;
}
#level1Choices{display:flex;gap:1.25vw;align-items:center;justify-content:center}
.img-button{
  appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;
  border-radius:1vw;transition:.14s transform,.14s filter,.14s box-shadow;
}
.img-button img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit;pointer-events:none}
.img-button:hover{transform:translateY(-.08vw);filter:brightness(1.08)}
.img-button:active{transform:translateY(.18vw)}
.img-button.selected{box-shadow:0 0 1.4vw #ffe053;outline:.22vw solid #ffe053}
.img-button.correct{box-shadow:0 0 1.4vw #68ea65;outline:.22vw solid #68ea65}
.img-button.wrong{box-shadow:0 0 1.4vw #ff5b51;outline:.22vw solid #ff5b51;animation:shake .28s}
.img-button.disabled{filter:grayscale(.75) brightness(.72);opacity:.78;pointer-events:none}

.level1-choice-img{width:8.2vw;min-width:86px}
#level1HintImage{
  position:absolute;z-index:47;left:15.7%;bottom:4.1%;width:15%;
}
#level1CheckImage{
  position:absolute;z-index:48;left:32.6%;bottom:8.8%;width:18.4%;
}
#level1NextImage{
  position:absolute;z-index:48;left:51.8%;bottom:8.8%;width:17.6%;
}

#settingsFullBtn{width:100%;margin-top:.55vw}

</style>
</head>
<body>
<div id="stage">
  <div id="screen"></div>
  <div id="scoreBadge"><span class="leaf">🍃</span><span id="scoreNum">0</span></div>
  <div id="hudProgress"></div>
  <div id="homeHot" class="toolbar-hot" title="Главное меню"></div>
  <div id="soundHot" class="toolbar-hot" title="Звук и громкость"></div>
  <div id="fullHot" class="toolbar-hot" title="Полный экран"></div>
  <div id="toast"></div>
  <div id="completeBurst"><div class="big">Испытание пройдено!</div><div class="small" id="completeText">🌰 +1 желудь</div></div>

  <div id="volumePanel" class="hidden">
    <button class="closex" id="volClose">×</button>
    <h3>⚙ Настройки</h3>
    <div class="volRow"><span>🎵 Музыка</span><input id="musicVol" type="range" min="0" max="100" step="5"><b id="musicPct"></b></div>
    <div class="volRow"><span>🎼 Мелодия</span><select id="musicTrack" class="musicSelect" aria-label="Фоновая мелодия"><option value="1">Лесная 1 · 2:32</option><option value="2">Лесная 2 · 0:44</option><option value="3">Лесная 3 · 1:03</option><option value="4">Лесная 4 · 0:39</option><option value="5">Лесная 5 · 1:01</option><option value="6">Лесная 6 · 2:38</option></select><b></b></div>
    <div class="volRow"><span>✨ Эффекты</span><input id="sfxVol" type="range" min="0" max="100" step="5"><b id="sfxPct"></b></div>
    <button id="muteAll" class="game-btn red small" style="width:100%;margin-top:.7vw">🔇 Выключить всё</button>
    <button id="settingsFullBtn" class="game-btn blue small">⛶ Полный экран</button>
  </div>

  <audio id="music" loop preload="none" src="assets/audio/music-01.mp3"></audio>
</div>

<script>
const IMG = {"home":"assets/images/scene-home.png","legend":"assets/images/scene-legend.webp","map":"assets/images/scene-map.webp","level1":"assets/images/scene-level1.webp","level2":"assets/images/scene-level2.webp","level3":"assets/images/scene-level3.webp","level4":"assets/images/scene-level4.webp","level5":"assets/images/scene-level5.webp","level6":"assets/images/scene-level6.webp","final":"assets/images/scene-final.webp"};
const BTNIMG = {"was":"assets/images/button-was.webp","were":"assets/images/button-were.webp","check":"assets/images/button-check.webp","next":"assets/images/button-next.webp","hint":"assets/images/button-hint.webp"};

const SFXSRC = {"click":"assets/audio/click.wav","correct":"assets/audio/correct.wav","wrong":"assets/audio/wrong.wav","leaf":"assets/audio/leaf.wav","acorn":"assets/audio/acorn.wav","hint":"assets/audio/hint.wav","bridge":"assets/audio/bridge.wav","magic":"assets/audio/magic.wav","complete":"assets/audio/complete.wav","door":"assets/audio/door.wav","steps":"assets/audio/steps.wav","victory":"assets/audio/victory.wav"};
const stage = document.getElementById('stage');
const screen = document.getElementById('screen');
const music = document.getElementById('music');
const scoreBadge = document.getElementById('scoreBadge');
const scoreNum = document.getElementById('scoreNum');
const hudProgress = document.getElementById('hudProgress');
const toast = document.getElementById('toast');
const burst = document.getElementById('completeBurst');
const completeText = document.getElementById('completeText');

const sfx = {};
for (const [k,v] of Object.entries(SFXSRC)) { sfx[k] = new Audio(v); sfx[k].preload='none'; }

let state = {
  screen:'home', level:0, score:0, acorns:0, unlockedLevel:1,
  musicVol: Number(localStorage.getItem('hedgehogMusicVol') ?? 40),
  sfxVol: Number(localStorage.getItem('hedgehogSfxVol') ?? 75),
  musicTrack: Math.max(1,Math.min(6,Number(localStorage.getItem('hedgehogMusicTrack') ?? 1))),
  muted:false,
  levelData:{},
  level1Order:null,
  viewToken:0
};
let toastTimer=0;

function later(fn,delay){
  const token=state.viewToken;
  return setTimeout(()=>{if(token===state.viewToken)fn()},delay);
}

function shuffledLevel1Order(){
  const a=[0,1,2,3,4];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}


function setMusicVolume(v){
  state.musicVol = Number(v); localStorage.setItem('hedgehogMusicVol',v);
  music.volume = state.muted ? 0 : state.musicVol/100;
  document.getElementById('musicPct').textContent = state.musicVol+'%';
}
function setSfxVolume(v){
  state.sfxVol = Number(v); localStorage.setItem('hedgehogSfxVol',v);
  for(const a of Object.values(sfx)) a.volume = state.muted ? 0 : state.sfxVol/100;
  document.getElementById('sfxPct').textContent = state.sfxVol+'%';
}
function playSfx(k, duck=false){
  const a=sfx[k]; if(!a||state.muted)return;
  try{
    a.currentTime=0;a.volume=state.sfxVol/100;
    const playback=a.play();
    if(playback?.catch)playback.catch(()=>{});
  }catch(e){}
  if(duck){
    const old=music.volume; music.volume=Math.min(old,.18);
    setTimeout(()=>music.volume=state.muted?0:state.musicVol/100,Math.min(1300,(a.duration||1)*1000));
  }
}
function startMusic(){
  music.volume=state.muted?0:state.musicVol/100;
  music.play().catch(()=>{});
}
function setMusicTrack(track,autoplay=false){
  const next=Math.max(1,Math.min(6,Number(track)||1));
  const wasPlaying=!music.paused;
  state.musicTrack=next;
  localStorage.setItem('hedgehogMusicTrack',String(next));
  music.src=`assets/audio/music-${String(next).padStart(2,'0')}.mp3`;
  music.load();
  music.volume=state.muted?0:state.musicVol/100;
  if(autoplay||wasPlaying)music.play().catch(()=>{});
}
function clickFx(){playSfx('click')}
function showToast(msg, kind=''){
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}
function sparkleBurst(count=14){
  for(let i=0;i<count;i++){
    const e=document.createElement('i'); e.className='spark';
    e.style.left=(40+Math.random()*20)+'%'; e.style.top=(48+Math.random()*8)+'%';
    e.style.setProperty('--dx',((Math.random()-.5)*10)+'vw');
    stage.appendChild(e); setTimeout(()=>e.remove(),3000);
  }
}
function updateHUD(){
  scoreNum.textContent=state.score;
  hudProgress.innerHTML='';
  hudProgress.style.display='none';

  const showHud = state.screen!=='home';
  scoreBadge.style.display=showHud?'flex':'none';

  document.getElementById('homeHot').style.display=showHud?'block':'none';

  // Звук доступен на каждом экране; полноэкранный режим находится только в настройках.
  document.getElementById('soundHot').style.display='block';
  document.getElementById('fullHot').style.display='none';
}
function setScreenBase(img, extraClass=''){
  state.viewToken++;
  document.getElementById('volumePanel').classList.add('hidden');
  toast.classList.remove('show');
  burst.classList.remove('show');
  clearTimeout(toastTimer);
  screen.innerHTML=`<img class="bg ${extraClass}" src="${img}">`;
}
function awardLeaf(qkey, hinted=false){
  if(hinted) return;
  const ld=state.levelData[state.level] ||= {awarded:new Set(),hinted:new Set()};
  if(ld.awarded.has(qkey))return;
  ld.awarded.add(qkey); state.score+=1; updateHUD();
  playSfx('leaf'); sparkleBurst(5);
}
function showComplete(level, special=''){
  state.acorns=Math.max(state.acorns,level);
  state.unlockedLevel=Math.max(state.unlockedLevel, Math.min(7, level+1));
  updateHUD();
  playSfx('acorn'); setTimeout(()=>playSfx('complete',true),150);
  if(special==='bridge') setTimeout(()=>playSfx('bridge',true),380);
  if(special==='magic') setTimeout(()=>playSfx('magic',true),350);
  const earned=state.levelData[level]?.awarded?.size||0;
  completeText.textContent=`🍃 Листочки за этап: ${earned} · 🌰 +1 желудь`;
  burst.classList.add('show'); sparkleBurst(24);
  later(()=>burst.classList.remove('show'),1450);
}
function markHinted(q){
  const ld=state.levelData[state.level] ||= {awarded:new Set(),hinted:new Set()};
  ld.hinted.add(String(q));
}
function isHinted(q){
  const ld=state.levelData[state.level];
  return !!ld && ld.hinted.has(String(q));
}

function showMap(nextLevel=state.unlockedLevel, animate=true){
  state.screen='map';
  state.level=Math.max(1,Math.min(7,nextLevel));
  setScreenBase(IMG.map);

  const previous=Math.max(1,Math.min(7,state.level-1));
  const [x0,y0]=mapPos[previous], [x1,y1]=mapPos[state.level];

  screen.insertAdjacentHTML('beforeend',`
    <div id="mapMessage">Выбери открытый этап на карте</div>
    <div id="mapMarker" style="left:${animate?x0:x1}%;top:${animate?y0:y1}%"><img src="assets/hedgehog-marker.png" alt=""></div>
  `);

  const marker=document.getElementById('mapMarker');
  if(animate && state.level>1){
    playSfx('steps');
    requestAnimationFrame(()=>later(()=>{
      marker.style.left=x1+'%'; marker.style.top=y1+'%';
    },120));
  }

  // Every map stage is represented by its own real HTML button.
  // Only unlocked stages react; the rest remain inactive until the previous stage is passed.
  for(let i=1;i<=7;i++){
    const [x,y]=mapPos[i];
    const b=document.createElement('button');
    b.className='map-stage-hotspot '+(i<=state.unlockedLevel?'unlocked':'locked');
    b.setAttribute('aria-label','Этап '+i);
    b.title=i<=state.unlockedLevel?('Открыть этап '+i):'Этап пока закрыт';
    b.style.left=(x-6)+'%';
    b.style.top=(y-7)+'%';
    b.style.width='12%';
    b.style.height='14%';
    if(i<=state.unlockedLevel){
      b.onclick=()=>{clickFx();showLevel(i)};
    }else{
      b.disabled=true;
    }
    screen.appendChild(b);
  }
  updateHUD();
}

function actionButtons(checkFn,nextFn=null,nextText='NEXT'){
  let bar=document.getElementById('actionBar'); if(bar)bar.remove();

  const c=document.createElement('button');c.className='img-button';c.setAttribute('aria-label','Проверить');c.innerHTML=`<img src="${BTNIMG.check}" alt="CHECK">`;c.onclick=()=>{clickFx();checkFn()};

function makeHits(spec, answers, hintable=true){
  const selected={}; const hits=[];
  spec.forEach((q,i)=>{
    ['was','were'].forEach(opt=>{
      const [x,y,w,h]=q[opt];
      const e=document.createElement('div');
      e.className='choice-hit'; e.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
      e.dataset.q=i; e.dataset.opt=opt;
      e.onclick=()=>{
        playSfx('click'); if(e.classList.contains('correct'))return;
        hits.filter(hh=>hh.dataset.q==i).forEach(h=>h.classList.remove('selected','wrong'));
        e.classList.add('selected');selected[i]=opt;
      };
      screen.appendChild(e); hits.push(e);
    })
  });
  if(hintable) hintButton(()=>{
    let q=answers.findIndex((a,i)=>!hits.some(h=>h.dataset.q==i&&h.classList.contains('correct')));
    if(q<0)return showToast('Все ответы уже найдены!');
    markHinted(q);
    const good=hits.find(h=>Number(h.dataset.q)===q&&h.dataset.opt===answers[q]);
    good.classList.add('hint-glow');setTimeout(()=>good.classList.remove('hint-glow'),3000);
    showToast('Подсказка показала верный вариант. За этот ответ листочек не начислится.');
  });
  return {selected,hits};
}
function checkHits(ctx,answers,onDone){
  if(ctx.completed)return;
  let all=true, any=false;
  answers.forEach((ans,i)=>{
    const sel=ctx.selected[i];
    const hs=ctx.hits.filter(h=>Number(h.dataset.q)===i);
    if(!sel){all=false;return}
    any=true;
    const chosen=hs.find(h=>h.dataset.opt===sel);
    if(sel===ans){
      chosen.classList.remove('selected','wrong');chosen.classList.add('correct');
      awardLeaf(String(i),isHinted(i)); playSfx('correct');
    }else{
      chosen.classList.add('wrong');chosen.classList.remove('selected');delete ctx.selected[i];all=false;playSfx('wrong');
    }
  });
  if(!any)showToast('Сначала выбери ответы.');
  else if(all){ctx.completed=true;onDone()}
  else showToast('Проверь красные ответы и попробуй ещё раз.');
}
function level1(){
  setScreenBase(IMG.level1);
  cleanupFloating();

  if(!state.level1Order) state.level1Order=shuffledLevel1Order();

  let pos=0;
  let selected=null;
  let checkedCorrect=false;

  screen.insertAdjacentHTML('beforeend',`
    <div id="level1SinglePanel">
      <div id="level1Counter"></div>
      <div id="level1Title">Испытание 1 · Лесная тропинка</div>
      <div id="level1Sentence"></div>
      <div id="level1Choices">
        <button class="img-button level1-choice-img" id="l1Was" aria-label="was"><img src="${BTNIMG.was}" alt="WAS"></button>
        <button class="img-button level1-choice-img" id="l1Were" aria-label="were"><img src="${BTNIMG.were}" alt="WERE"></button>
      </div>
    </div>
    <button class="img-button" id="level1HintImage" aria-label="Подсказка"><img src="${BTNIMG.hint}" alt="Подсказка"></button>
    <button class="img-button" id="level1CheckImage" aria-label="Check"><img src="${BTNIMG.check}" alt="CHECK"></button>
    <button class="img-button disabled" id="level1NextImage" aria-label="Next"><img src="${BTNIMG.next}" alt="NEXT"></button>
  `);

  const wasBtn=document.getElementById('l1Was');
  const wereBtn=document.getElementById('l1Were');
  const checkBtn=document.getElementById('level1CheckImage');
  const nextBtn=document.getElementById('level1NextImage');
  const hintBtnImg=document.getElementById('level1HintImage');

  function currentItem(){
    return LEVEL1_ITEMS[state.level1Order[pos]];
  }
  function clearChoiceStyles(){
    [wasBtn,wereBtn].forEach(b=>b.classList.remove('selected','correct','wrong','hint-glow'));
  }
  function renderQuestion(){
    selected=null; checkedCorrect=false;
    clearChoiceStyles();
    nextBtn.classList.add('disabled');
    const item=currentItem();
    document.getElementById('level1Counter').textContent=`Вопрос ${pos+1} из 5`;
    document.getElementById('level1Sentence').textContent=item.text;
  }
  function choose(value,btn){
    if(checkedCorrect)return;
    playSfx('click');
    clearChoiceStyles();
    selected=value;btn.classList.add('selected');
  }

  wasBtn.onclick=()=>choose('was',wasBtn);
  wereBtn.onclick=()=>choose('were',wereBtn);

  hintBtnImg.onclick=()=>{
    clickFx();playSfx('hint',true);
    const item=currentItem();
    markHinted(item.id);
    const good=item.answer==='was'?wasBtn:wereBtn;
    good.classList.add('hint-glow');
    setTimeout(()=>good.classList.remove('hint-glow'),3000);
    showToast('Подсказка показала правильный ответ. За этот вопрос листочек не начислится.');
  };

  checkBtn.onclick=()=>{
    clickFx();
    if(checkedCorrect)return showToast('Ответ уже проверен. Нажми NEXT.');
    if(!selected)return showToast('Сначала выбери WAS или WERE.');

    const item=currentItem();
    const chosen=selected==='was'?wasBtn:wereBtn;

    if(selected===item.answer){
      clearChoiceStyles();
      chosen.classList.add('correct');
      checkedCorrect=true;
      awardLeaf(item.id,isHinted(item.id));
      playSfx('correct');
      nextBtn.classList.remove('disabled');
      showToast('Верно! Нажми NEXT.');
    }else{
      clearChoiceStyles();
      chosen.classList.add('wrong');
      checkedCorrect=true;
      playSfx('wrong');
      nextBtn.classList.remove('disabled');
      showToast('Неверно. Нажми NEXT.');
    }
  };

  nextBtn.onclick=()=>{
    if(!checkedCorrect)return;
    clickFx();
    if(pos<4){
      pos++;
      renderQuestion();
    }else{
      showComplete(1);
      later(()=>{cleanupFloating();showMap(2,true)},1550);
    }
  };

  renderQuestion();
}
function level2(){
  setScreenBase(IMG.level2);
  let completed=false;
  const cards=[
    {x:29.2,y:63.5,w:18.8,h:18.8,ans:'was',reveal:'Was the squirrel happy yesterday?'},
    {x:50.0,y:63.5,w:19.0,h:18.8,ans:'was',reveal:'Was the rabbit playing near the tree?'},
    {x:71.0,y:63.5,w:20.0,h:18.8,ans:'were',reveal:'Were the owls resting all day?'}
  ];
  const selected={};
  cards.forEach((c,i)=>{
    const e=document.createElement('div');e.className='overlay-card';e.style.cssText=`left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%`;
    e.innerHTML=`<div style="font-weight:bold;font-size:clamp(11px,.9vw,18px)">Выбери глагол для вопроса:</div>
      <div class="opts"><button class="mini-choice" data-v="was">WAS</button><button class="mini-choice" data-v="were">WERE</button></div>
      <div class="reveal hidden"></div>`;
    e.querySelectorAll('.mini-choice').forEach(b=>b.onclick=()=>{
      playSfx('click');e.querySelectorAll('.mini-choice').forEach(z=>z.classList.remove('sel','no'));
      b.classList.add('sel');selected[i]=b.dataset.v;
    });
    screen.appendChild(e);
  });
  hintButton(()=>{
    const i=cards.findIndex((c,j)=>!screen.querySelectorAll('.overlay-card')[j].querySelector('.reveal')?.textContent);
    if(i<0)return showToast('Все вопросы уже открыты!');
    markHinted(i);const card=screen.querySelectorAll('.overlay-card')[i];
    const b=[...card.querySelectorAll('.mini-choice')].find(b=>b.dataset.v===cards[i].ans);
    b.classList.add('hint-glow');setTimeout(()=>b.classList.remove('hint-glow'),3000);
    showToast('Подсказка показала верный глагол. За этот вопрос листочек не начислится.');
  });
  actionButtons(()=>{
    if(completed)return;
    let all=true;
    cards.forEach((c,i)=>{
      const card=screen.querySelectorAll('.overlay-card')[i], buttons=[...card.querySelectorAll('.mini-choice')], sel=selected[i];
      if(!sel){all=false;return}
      const b=buttons.find(z=>z.dataset.v===sel);
      if(sel===c.ans){

        awardLeaf(String(i),isHinted(i));playSfx('correct');
      }else{
        b.classList.add('no');delete selected[i];all=false;playSfx('wrong');
      }
    });

function level3(){
  setScreenBase(IMG.level3);
  let completed=false;
  const selected={};const hits=[];
  const xs=[[10.4,18.1],[32.4,40.2],[54.3,61.8],[75.5,82.6]];
  xs.forEach((pair,i)=>{
    ['yes','no'].forEach((opt,k)=>{
      const e=document.createElement('div');e.className='choice-hit';
      e.style.cssText=`left:${pair[k]}%;top:76.8%;width:6.9%;height:6.3%`;
      e.onclick=()=>{
        playSfx('click');hits.filter(h=>h.dataset.q==i).forEach(h=>h.classList.remove('selected'));
        e.classList.add('selected');selected[i]=opt;
      };
      e.dataset.q=i;e.dataset.opt=opt;screen.appendChild(e);hits.push(e)
    })
  });
  actionButtons(()=>{
    if(completed)return;
    if(Object.keys(selected).length<4)return showToast('Ответь на все четыре вопроса.');
    for(let i=0;i<4;i++){
      hits.filter(h=>Number(h.dataset.q)===i).find(h=>h.dataset.opt===selected[i]).classList.add('correct');
      awardLeaf(String(i),false);
    }
    playSfx('correct');showToast('Отлично! Здесь важны твои личные ответы.');
    completed=true;showComplete(3,'bridge');later(()=>{cleanupFloating();showMap(4,true)},1700)
  });

    });
    if(all){completed=true;showComplete(6,'magic');later(()=>{cleanupFloating();showMap(7,true)},1650)}
    else showToast('Проверь преобразования.');
  });
}
const L7=[
 {s:'Tony was at the cinema yesterday.',
  neg:['Tony was not at the cinema yesterday.','Tony were not at the cinema yesterday.'],
  q:['Was Tony at the cinema yesterday?','Were Tony at the cinema yesterday?'],ni:0,qi:0},
 {s:'There were some potatoes for lunch.',
  neg:['There were not any potatoes for lunch.','There was not any potatoes for lunch.'],
  q:['Were there any potatoes for lunch?','Was there any potatoes for lunch?'],ni:0,qi:0},
 {s:'Our sister was in class last week.',
  neg:['Our sister was not in class last week.','Our sister were not in class last week.'],
  q:['Was our sister in class last week?','Were our sister in class last week?'],ni:0,qi:0},
 {s:'Some pupils were late last Friday.',
  neg:['Some pupils were not late last Friday.','Some pupils was not late last Friday.'],
  q:['Were any pupils late last Friday?','Was any pupils late last Friday?'],ni:0,qi:0},
 {s:'The book was cheaper than the toy.',
  neg:['The book was not cheaper than the toy.','The book were not cheaper than the toy.'],
  q:['Was the book cheaper than the toy?','Were the book cheaper than the toy?'],ni:0,qi:0}
];
let l7={idx:0,step:'neg',done:0,locked:false};
function level7(){
  setScreenBase(IMG.level6,'blur-bg');
  screen.insertAdjacentHTML('beforeend','<div class="tint" style="background:rgba(7,18,28,.36)"></div><div id="level7Panel"></div>');
  l7={idx:0,step:'neg',done:0,locked:false};renderL7();
  hintButton(()=>{
    const item=L7[l7.idx], correct=l7.step==='neg'?item.ni:item.qi;
    markHinted(`${l7.idx}-${l7.step}`);
    const opt=document.querySelectorAll('.l7opt')[correct];
    opt.classList.add('hint-glow');setTimeout(()=>opt.classList.remove('hint-glow'),3000);
    showToast('Подсказка показала правильный вариант. За этот шаг листочек не начислится.');
  });
}
function renderL7(){
  l7.locked=false;
  const p=document.getElementById('level7Panel'),item=L7[l7.idx];
  const opts=l7.step==='neg'?item.neg:item.q;
  p.innerHTML=`<h2>Испытание 7. Последняя загадка</h2>
   <div class="sub">Преобразуй предложения в отрицательную и вопросительную формы.</div>
   <div id="l7Progress">Предложение ${l7.idx+1} из 5 · ${l7.step==='neg'?'Шаг 1 из 2':'Шаг 2 из 2'}</div>
   <div id="l7Sentence">${item.s}</div>
   <div id="l7StepTitle">${l7.step==='neg'?'Выбери правильную отрицательную форму:':'Выбери правильный вопрос:'}</div>
   <div id="l7Options">${opts.map((o,i)=>`<div class="l7opt" data-i="${i}">${o}</div>`).join('')}</div>`;
  [...p.querySelectorAll('.l7opt')].forEach(o=>o.onclick=()=>checkL7(Number(o.dataset.i),o));
}
function checkL7(choice,el){
  if(l7.locked)return;
  clickFx();const item=L7[l7.idx],correct=l7.step==='neg'?item.ni:item.qi;
  if(choice!==correct){el.classList.add('no');playSfx('wrong');showToast('Попробуй ещё раз.');return}
  l7.locked=true;
  el.classList.add('ok');playSfx('correct');
  const key=`${l7.idx}-${l7.step}`;awardLeaf(key,isHinted(key));l7.done++;
  later(()=>{
    if(l7.step==='neg'){l7.step='q';renderL7()}
    else if(l7.idx<4){l7.idx++;l7.step='neg';renderL7()}
    else{
      cleanupFloating();showComplete(7,'magic');
       later(()=>{playSfx('door',true);later(finalScreen,700)},1450)
    }
  },650)
}
function finalScreen(){
  state.screen='final';state.level=7;setScreenBase(IMG.final);
  cleanupFloating();updateHUD();
  screen.insertAdjacentHTML('beforeend',`<div id="finalScore">🍃 Листочки: ${state.score} &nbsp; 🌰 Жёлуди: ${state.acorns}</div>
    <div id="finalHotReplay"></div><div id="finalHotHome"></div>`);
  playSfx('victory',true);sparkleBurst(40);
  document.getElementById('finalHotReplay').onclick=()=>{clickFx();resetGame();legend()};
  document.getElementById('finalHotHome').onclick=()=>{clickFx();resetGame();home()};
}
function resetGame(){
  state.score=0;
  state.acorns=0;
  state.unlockedLevel=1;
  state.levelData={};
  state.level=0;
  state.level1Order=shuffledLevel1Order();
  updateHUD();
}
function openVolume(){
  const p=document.getElementById('volumePanel');p.classList.remove('hidden');
  document.getElementById('musicVol').value=state.musicVol;
  document.getElementById('sfxVol').value=state.sfxVol;
  document.getElementById('musicTrack').value=String(state.musicTrack);
  setMusicVolume(state.musicVol);setSfxVolume(state.sfxVol);
}
async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement)await stage.requestFullscreen?.();
    else await document.exitFullscreen?.();
  }catch(e){
    showToast('Полноэкранный режим недоступен в этом браузере.');
  }
}
document.getElementById('musicVol').oninput=e=>setMusicVolume(e.target.value);
document.getElementById('sfxVol').oninput=e=>setSfxVolume(e.target.value);
document.getElementById('musicTrack').onchange=e=>{clickFx();setMusicTrack(e.target.value,true)};
document.getElementById('volClose').onclick=()=>{clickFx();document.getElementById('volumePanel').classList.add('hidden')};
document.getElementById('settingsFullBtn').onclick=()=>{
 clickFx();toggleFullscreen();
};
document.getElementById('muteAll').onclick=()=>{
 clickFx();state.muted=!state.muted;
 document.getElementById('muteAll').textContent=state.muted?'🔊 Включить всё':'🔇 Выключить всё';
 setMusicVolume(state.musicVol);setSfxVolume(state.sfxVol)
};
document.getElementById('soundHot').onclick=()=>{clickFx();openVolume()};
document.getElementById('fullHot').onclick=()=>{
 clickFx();toggleFullscreen();
};
document.getElementById('homeHot').onclick=()=>{clickFx();cleanupFloating();home()};

const keyMap={
 click:'click',correct:'correct',wrong:'wrong',leaf:'leaf',acorn:'acorn',hint:'hint',
 bridge:'bridge',magic:'magic',complete:'complete',door:'door',steps:'steps',victory:'victory'
};
setMusicTrack(state.musicTrack,false);setMusicVolume(state.musicVol);setSfxVolume(state.sfxVol);
