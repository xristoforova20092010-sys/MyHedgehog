<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>День ежа — was / were</title>
<style>
:root{--cream:#fff4cf;--wood:#5f3217;--green:#4e7d28;--gold:#f5bb36;--red:#b93d32;--purple:#673b7f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07150f;font-family:Georgia,"Times New Roman",serif}
button{font:inherit}#game{position:relative;width:min(100vw,calc(100vh * 1.7778));aspect-ratio:16/9;max-height:100vh;margin:auto;overflow:hidden;background:#102217;box-shadow:0 0 50px #000}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:#06170b55}
#hud{position:absolute;z-index:30;left:1.2%;top:1.8%;right:1.2%;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.score,.progress{padding:.55vw 1vw;border:.17vw solid #704018;border-radius:1vw;background:#fff0bded;color:#4b280e;font-weight:900;font-size:clamp(14px,1.25vw,24px);box-shadow:0 .35vw .8vw #0006}
.controls{display:flex;gap:.55vw;pointer-events:auto}.icon{width:3.7vw;height:3.7vw;min-width:38px;min-height:38px;border:.16vw solid #6d3d19;border-radius:50%;background:#fff0bd;color:#4b280e;cursor:pointer;font-weight:900;box-shadow:0 .25vw .6vw #0007}
.panel{position:absolute;z-index:20;left:50%;top:53%;transform:translate(-50%,-50%);width:min(72%,980px);padding:1.3vw 2vw;border:.3vw solid #633515;border-radius:1.6vw;background:linear-gradient(#fff6d7f7,#edcf8ff7);box-shadow:0 1vw 2.5vw #0009,inset 0 0 0 .16vw #d89a3c;text-align:center;color:#3e210e}
.panel h1,.panel h2{margin:.1em 0 .35em;color:#315f29;text-shadow:0 1px #fff}.panel h1{font-size:clamp(34px,4vw,76px)}.panel h2{font-size:clamp(24px,2.4vw,46px)}
.instruction{font-size:clamp(14px,1.2vw,23px);font-weight:700;color:#6b3b1b;margin-bottom:.8vw}.counter{font-weight:900;color:#69428a;font-size:clamp(14px,1.05vw,20px)}
.question{margin:.65vw auto 1vw;padding:1vw;border:.14vw dashed #97632d;border-radius:1vw;background:#fff9e5cc;font-size:clamp(22px,2.25vw,43px);font-weight:900;line-height:1.2}
.answers{display:flex;flex-wrap:wrap;justify-content:center;gap:1vw}.answer,.action{border:.18vw solid #3c210f;border-radius:1vw;padding:.65vw 1.6vw;cursor:pointer;color:#fff8dc;font-weight:900;font-size:clamp(17px,1.5vw,29px);text-shadow:0 .1vw .1vw #251006;box-shadow:0 .3vw 0 #371b0b,0 .55vw 1vw #0005;transition:.14s}
.answer{min-width:10vw;background:linear-gradient(#83ad36,#47751f)}.answer:hover,.action:hover{filter:brightness(1.1);transform:translateY(-.08vw)}.answer.correct{outline:.32vw solid #72ef68;box-shadow:0 0 1.4vw #55de65}.answer.wrong{outline:.32vw solid #ff6257;box-shadow:0 0 1.4vw #ff4e43;animation:shake .28s}.answer:disabled{cursor:default}
.actions{display:flex;justify-content:center;gap:1.1vw;margin-top:1.1vw}.action{background:linear-gradient(#5ba5d1,#176c99)}.action.gold{background:linear-gradient(#ffd55e,#dd8d17);color:#4b260c}.action.purple{background:linear-gradient(#a068bf,#61307d)}.action:disabled{filter:grayscale(1);opacity:.5;pointer-events:none}
.feedback{min-height:1.6em;margin-top:.7vw;font-size:clamp(14px,1.15vw,22px);font-weight:900}.result-grid{display:flex;justify-content:center;gap:2vw;margin:1vw 0}.result-item{font-size:clamp(18px,1.8vw,34px);font-weight:900}.pass{color:#347327}.fail{color:#a4372c}
@keyframes shake{25%{transform:translateX(-.35vw)}75%{transform:translateX(.35vw)}}
@media(max-width:700px){.panel{width:88%;padding:2vw}.question{font-size:clamp(18px,3vw,30px)}.answer,.action{font-size:clamp(14px,2.3vw,22px);padding:.7vw 2vw}.score,.progress{font-size:12px}}
</style>
</head>
<body><main id="game" aria-live="polite"></main>
<script>
const slides=Array.from({length:9},(_,i)=>`assets/slides/slide-${i+1}.png`);
const stages=[
 {title:'Лесная тропинка',slide:1,instruction:'Выбери was или were.',items:[
  ['The food ___ bad.','was'],['Mary and her mother ___ at a cafe.','were'],['___ the film interesting?','was'],['My sisters ___ not happy yesterday.','were'],['Who ___ the best student in the class?','was'],['I ___ at home last night.','was'],['The children ___ in the garden.','were'],['The weather ___ cold.','was'],['We ___ at the zoo.','were'],['You ___ very kind.','were']]},
 {title:'Друзья ёжика',slide:2,instruction:'Выбери начало правильного вопроса.',items:[
  ['The squirrel was happy yesterday.','Was','Were'],['The rabbit was playing near the tree.','Was','Were'],['The owls were resting all day.','Were','Was'],['The birds were in the forest.','Were','Was'],['The fox was near the river.','Was','Were']]},
 {title:'Мост лягушки',slide:3,instruction:'Ответь на вопросы о себе. Здесь оба ответа допустимы.',personal:true,items:[
  ['Were you at school yesterday?'],['Were you at the cinema last weekend?'],['Were you at home last Sunday?'],['Was your friend in the park yesterday?'],['Was the weather good yesterday?']]},
 {title:'Лесной дух',slide:4,instruction:'Заполни пропуски.',items:[
  ['She ___ sad yesterday.','was'],['We ___ at the zoo yesterday.','were'],['Mum and Dad ___ in a restaurant.','were'],['Our teacher ___ very tired.','was'],['She ___ pretty when she was young.','was'],['I ___ in London in 2008.','was'],['My cousins ___ at school.','were']]},
 {title:'Ночной волшебник',slide:5,instruction:'Зажги огоньки правильными ответами.',items:[
  ["It ___ Vicky's tenth birthday.",'was'],['She ___ in the garden.','was'],['The trees ___ green.','were'],['We ___ in the park.','were'],['I ___ at home.','was'],['The fireflies ___ bright.','were']]},
 {title:'Путеводная звезда',slide:6,instruction:'Исправь ошибку: выбери правильное предложение.',choiceText:true,items:[
  ['My pets were lovely.','My pets was lovely.'],['Were you at home?','Was you at home?'],['The weather was cold.','The weather were cold.'],['They were near the tree.','They was near the tree.'],['Was he tired?','Were he tired?']]},
 {title:'Последняя загадка',slide:7,instruction:'Выбери правильное преобразование.',choiceText:true,items:[
  ['Tony was not at the cinema yesterday.','Tony were not at the cinema yesterday.'],['Was Tony at the cinema yesterday?','Were Tony at the cinema yesterday?'],['There were not any potatoes for lunch.','There was not any potatoes for lunch.'],['Were there any potatoes for lunch?','Was there any potatoes for lunch?'],['Our sister was not in class last week.','Our sister were not in class last week.'],['Was our sister in class last week?','Were our sister in class last week?'],['Some pupils were not late last Friday.','Some pupils was not late last Friday.'],['Were any pupils late last Friday?','Was any pupils late last Friday?']]}
];
const game=document.querySelector('#game');let state={stage:0,q:0,correct:0,wrong:0,leaves:0,totalLeaves:0,sound:true,answered:false};
let audioCtx;function sound(ok=true){if(!state.sound)return;audioCtx||=new AudioContext();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=ok?660:180;o.type=ok?'sine':'sawtooth';g.gain.setValueAtTime(.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.18)}
function shell(slide,content,showHud=true){game.innerHTML=`<img class="scene" src="${slides[slide]}" alt=""><div class="shade"></div>${showHud?`<div id="hud"><div class="score">🍃 ${state.totalLeaves}</div><div class="progress">Испытание ${Math.min(state.stage+1,7)} из 7</div><div class="controls"><button class="icon" id="home" aria-label="Главная">⌂</button><button class="icon" id="soundToggle" aria-label="Звук">${state.sound?'🔊':'🔇'}</button><button class="icon" id="full" aria-label="Полный экран">⛶</button></div></div>`:''}${content}`;if(showHud){document.querySelector('#home').onclick=homeScreen;document.querySelector('#soundToggle').onclick=()=>{state.sound=!state.sound;renderStage()};document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():game.requestFullscreen?.()}}
function homeScreen(){state={stage:0,q:0,correct:0,wrong:0,leaves:0,totalLeaves:0,sound:state.sound,answered:false};shell(0,`<section class="panel"><h1>День ежа</h1><p class="instruction">Помоги ёжику пройти семь испытаний, повторить was / were и вернуться домой.</p><div class="actions"><button class="action gold" id="start">Начать путешествие</button></div></section>`,false);document.querySelector('#start').onclick=()=>{state.stage=0;resetStage();renderStage()}}
function resetStage(){state.q=0;state.correct=0;state.wrong=0;state.leaves=0;state.answered=false}
function optionsFor(stage,item){if(stage.personal)return['Yes','No'];if(stage.choiceText)return[item[0],item[1]];if(item.length===3)return[item[1],item[2]];return['was','were']}
function correctFor(stage,item){if(stage.personal)return null;if(stage.choiceText)return item[0];return item[1]}
function renderStage(){const s=stages[state.stage],item=s.items[state.q],options=optionsFor(s,item);shell(s.slide,`<section class="panel"><div class="counter">Вопрос ${state.q+1} из ${s.items.length}</div><h2>${s.title}</h2><div class="instruction">${s.instruction}</div><div class="question">${s.choiceText?'Выбери правильный вариант':item[0]}</div><div class="answers">${options.map(x=>`<button class="answer" data-value="${encodeURIComponent(x)}">${x}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="action gold" id="hint">Подсказка</button><button class="action" id="next" disabled>${state.q===s.items.length-1?'Результат':'Следующий вопрос'}</button></div></section>`);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(decodeURIComponent(b.dataset.value),b,s,item));document.querySelector('#hint').onclick=()=>showHint(s,item);document.querySelector('#next').onclick=()=>{if(state.q<s.items.length-1){state.q++;state.answered=false;renderStage()}else resultScreen()}}
function choose(value,button,s,item){if(state.answered)return;state.answered=true;const expected=correctFor(s,item),ok=s.personal||value===expected,feedback=document.querySelector('#feedback');if(ok){button.classList.add('correct');state.correct++;state.leaves++;sound(true);feedback.textContent='Правильно! +1 листочек';feedback.className='feedback pass'}else{button.classList.add('wrong');state.wrong++;sound(false);feedback.textContent='Неправильно.';feedback.className='feedback fail'}document.querySelectorAll('.answer').forEach(b=>b.disabled=true);document.querySelector('#next').disabled=false}
function showHint(s,item){if(state.answered)return;const expected=correctFor(s,item),feedback=document.querySelector('#feedback');if(expected===null){feedback.textContent='Ответь так, как было у тебя.';return}const target=[...document.querySelectorAll('.answer')].find(b=>decodeURIComponent(b.dataset.value)===expected);target?.classList.add('correct');feedback.textContent=`Правильный ответ: ${expected}`}
function resultScreen(){const s=stages[state.stage],passed=s.personal||state.correct>=Math.ceil(s.items.length*.6);shell(s.slide,`<section class="panel"><h2>${passed?'Испытание пройдено!':'Попробуй ещё раз'}</h2><div class="result-grid"><div class="result-item pass">✓ ${state.correct}</div><div class="result-item fail">✗ ${state.wrong}</div><div class="result-item">🍃 ${state.leaves}</div></div><p class="instruction">${passed?'Ёжик стал ещё ближе к дому.':'Для прохождения нужно не менее 60% правильных ответов.'}</p><div class="actions"><button class="action ${passed?'gold':'purple'}" id="resultAction">${passed?(state.stage===stages.length-1?'К дому':'Дальше'):'Повторить этап'}</button></div></section>`);document.querySelector('#resultAction').onclick=()=>{if(!passed){resetStage();renderStage();return}state.totalLeaves+=state.leaves;if(state.stage===stages.length-1){finalScreen();return}state.stage++;resetStage();renderStage()}}
function finalScreen(){shell(8,`<section class="panel"><h1>Ёжик дома!</h1><p class="instruction">Все семь испытаний пройдены. Заработано листочков: ${state.totalLeaves}.</p><div class="actions"><button class="action gold" id="again">Играть снова</button></div></section>`,false);document.querySelector('#again').onclick=homeScreen}
homeScreen();
</script></body></html>
